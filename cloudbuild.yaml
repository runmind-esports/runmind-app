steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://runmid-api-620849332552.us-central1.run.app'
      - '--build-arg'
      - 'NEXT_PUBLIC_AUTH_API_URL=https://runmind-cara-cracha-620849332552.southamerica-east1.run.app'
      - '--build-arg'
      - 'NEXT_PUBLIC_RUNMID_API_URL=https://runmid-api-620849332552.us-central1.run.app'
      - '--build-arg'
      - 'NEXT_PUBLIC_STRAVA_CLIENT_ID=165299'
      - '--build-arg'
      - 'NEXT_PUBLIC_CHAT_API_URL=https://runmind-chat-agent-620849332552.southamerica-east1.run.app'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/runmind-app:$BUILD_ID'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/runmind-app:$BUILD_ID'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'runmind-app'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/runmind-app:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/runmind-app:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY