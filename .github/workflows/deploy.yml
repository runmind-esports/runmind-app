name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - '.planning/**'
      - '*.md'
      - '.claude/**'

env:
  PROJECT_ID: runmind-483617
  REGION: us-central1
  SERVICE: runmind-app
  IMAGE: gcr.io/runmind-483617/runmind-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_AUTH_API_URL=${{ vars.NEXT_PUBLIC_AUTH_API_URL }} \
            --build-arg NEXT_PUBLIC_RUNMID_API_URL=${{ vars.NEXT_PUBLIC_RUNMID_API_URL }} \
            --build-arg NEXT_PUBLIC_STRAVA_CLIENT_ID=${{ vars.NEXT_PUBLIC_STRAVA_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_CHAT_API_URL=${{ vars.NEXT_PUBLIC_CHAT_API_URL }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
